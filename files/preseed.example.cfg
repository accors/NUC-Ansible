#### Debian 13.6 (trixie) preseed —— agent-nuc
#### 对应 PDF 第 5 章的安装器逐项选择
####
#### 本文件是模板,提交进 Git。使用前复制为 files/preseed.cfg(不提交):
####
####     cp files/preseed.example.cfg files/preseed.cfg
####
#### 然后替换以下三处占位:
####   1. CHANGE_ME —— 管理员用户名,须与 group_vars/all/local.yml 的
####      nuc_admin_user 和 inventory.yml 的 ansible_user 一致。
####   2. <<<PASSWORD_HASH>>> —— 该账号的密码哈希,用 `mkpasswd -m sha-512` 生成
####      (Debian/Ubuntu 上由 whois 包提供)。生成后原始密码不要记入仓库。
####   3. <<<SSH_PUBLIC_KEY>>> —— 该账号的 SSH 公钥,整行照抄 ~/.ssh/id_ed25519.pub。
####      同一把公钥必须同时出现在 local.yml 的 nuc_admin_authorized_keys 中,
####      否则 ssh_harden 会在关闭密码认证时把它移除。
####
#### 填好的 files/preseed.cfg 含真实凭据,已由 .gitignore 排除,不要提交。

### 本地化(PDF 5)
d-i debian-installer/language string en
d-i debian-installer/country string AU
d-i debian-installer/locale string en_AU.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### 网络
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string agent-nuc
d-i netcfg/get_domain string
d-i netcfg/hostname string agent-nuc

### 镜像(联网安装时使用;离线安装由 DVD-1 完成基础系统)
d-i mirror/country string AU
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### 账号 —— root 禁用,首个普通用户获得 sudo(PDF 5)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string agent-nuc admin
d-i passwd/username string CHANGE_ME
d-i passwd/user-password-crypted password <<<PASSWORD_HASH>>>
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

### 时区
d-i clock-setup/utc boolean true
d-i time/zone string Australia/Melbourne
d-i clock-setup/ntp boolean true

### 分区 —— 整盘、单一分区、不加密不用 LVM(PDF 5 / 5.2)
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### 软件选择 —— 首期只要 SSH server 与 standard(PDF 5.1)
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server sudo python3 ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/nvme0n1

### 完成
d-i finish-install/reboot_in_progress note

### late_command —— 注入公钥,让 Ansible 首跑就能用密钥连接
d-i preseed/late_command string \
  mkdir -p /target/home/CHANGE_ME/.ssh ; \
  echo '<<<SSH_PUBLIC_KEY>>>' > /target/home/CHANGE_ME/.ssh/authorized_keys ; \
  in-target chown -R CHANGE_ME:CHANGE_ME /home/CHANGE_ME/.ssh ; \
  in-target chmod 700 /home/CHANGE_ME/.ssh ; \
  in-target chmod 600 /home/CHANGE_ME/.ssh/authorized_keys
