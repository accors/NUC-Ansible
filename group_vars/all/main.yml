---
# 本文件提交进 Git，只保留结构与非环境相关的默认值。
#
# 环境相关的值（管理员账号、公钥、LAN 网段、Tailscale 地址、Access 域名）
# 不在此文件中，由不提交的 group_vars/all/local.yml 提供；模板见
# group_vars/all/local.yml.example。Ansible 按字母序加载 group_vars/all/ 下的
# 所有 yml 且后者覆盖前者，local 排在 main 之后，因此无需额外配置。
#
# 变量清单与来源章节以 CONVENTIONS.md 第 2 节为准。
#
# --- 由 local.yml 提供（此处不设默认值，缺失时 play 会以未定义变量中止）---
#
# nuc_admin_user            string
#   已由 Debian 安装器创建的个人管理员账号；Paseo 与交互式 Codex 使用此账号。
#   与 inventory.yml 的 ansible_user 保持一致。（CONVENTIONS 2.1、PDF 7.1、8.3）
#
# nuc_admin_authorized_keys list[string]
#   管理员登录公钥，至少一把。ssh_harden 以 exclusive: true 写入
#   ~/.ssh/authorized_keys，因此该列表必须覆盖所有需要保留的公钥（包括
#   preseed late_command 注入的那把），否则会在关闭密码认证的同一次运行中被移除。
#   为空时 ssh_harden 必须在关闭密码认证前失败。（CONVENTIONS 2.1、PDF 7.1）
#
# nuc_lan_cidr              string
#   家庭 LAN 网段，在 NUC 上用 `ip route` 实测得到。UFW 只允许该网段访问 SSH，
#   填错会在 `--tags base` 启用 UFW 时阻断 SSH。（CONVENTIONS 2.1、PDF 7.2）
#
# nuc_static_ipv4          string
#   enp86s0 的静态地址。掩码不单独设，由 nuc_lan_cidr 的前缀推导——UFW 规则用的是
#   同一个 CIDR，分开写迟早出现 /22 与 /24 不一致，而那种错误要等到访问网段高位
#   地址时才暴露。必须落在 nuc_lan_cidr 内、不是网络地址或广播地址、且不等于网关；
#   network role 在写入 profile 前逐条断言。（CONVENTIONS 2.1）
#
# nuc_lan_gateway          string
#   默认网关，实测 `ip route` 中 default via 的地址。（CONVENTIONS 2.1）
#
# nuc_lan_dns              list[string]
#   DNS 解析器，至少一个。切换到静态后 DHCP 不再下发 DNS，必须显式给出，
#   否则重启后解析全断。（CONVENTIONS 2.1）
#
# nuc_hostname              string
#   目标机的系统主机名，由 base role 写入 /etc/hostname 与 /etc/hosts 的 127.0.1.1。
#   必须是合法 RFC 1123 标签；base 在设置前先校验，格式非法即失败——写坏之后 sudo
#   会反复报 unable to resolve host，且需要控制台才能修回来。（CONVENTIONS 2.1）
#
# nuc_tailscale_ipv4        string
#   人工执行 `sudo tailscale up` 授权后，用 `tailscale ip -4` 实测得到的唯一地址。
#   必须属于 100.64.0.0/10；tailscale role 会与实测值比对，不一致即失败。
#   **不进入 Paseo 的 daemon.listen**（那是 0.0.0.0:<port>，隔离交给 UFW），
#   但必须进入 daemon.hostnames —— tailnet 客户端用它做 Host 校验，顺手删掉会
#   被拒绝，且现象看起来像「连接被拒绝」。（CONVENTIONS 2.1、PDF 8.5、10.2）
#
# nuc_access_hostname       string
#   Cloudflare Published application 的 Hostname，必须与 Dashboard 中完全一致，
#   并会写入 Paseo config.json 的 daemon.hostnames。（CONVENTIONS 2.1、PDF 8.5、10.4）
#
# nuc_restic_repository     string
#   Restic 备份仓库地址：本地路径或远端 URL（sftp:/s3:/rest: 等）。URL 中不得嵌入
#   账号、密码或 token，凭据一律走 vault_nuc_restic_password。该地址会暴露备份位置
#   与内网主机名，因此不写入提交进仓库的 main.yml。（CONVENTIONS 2.4、PDF 12.2）

# --- 以下为非环境相关的默认值，随 repo 提交 ---
nuc_paseo_port: 6767

nuc_agent_runner_user: agent-runner
nuc_agent_runner_home: /var/lib/agent-runner
nuc_agent_runner_workdir: /srv/automation
nuc_agent_runner_codex_home: /var/lib/agent-runner/codex

nuc_timezone: Australia/Melbourne
nuc_debian_codename: trixie
nuc_architecture: amd64

nuc_srv_directories:
  - path: /srv/workspaces
    owner: "{{ nuc_admin_user }}"
    group: "{{ nuc_admin_user }}"
    mode: "0750"
    purpose: 长期项目与 Agent 工作区
    managed_by: srv_layout
  - path: /srv/worktrees
    owner: "{{ nuc_admin_user }}"
    group: "{{ nuc_admin_user }}"
    mode: "0750"
    purpose: 可清理重建的 Git worktree
    managed_by: srv_layout
  - path: /srv/stacks
    owner: "{{ nuc_admin_user }}"
    group: "{{ nuc_admin_user }}"
    mode: "0750"
    purpose: Compose 定义、环境模板与服务文档
    managed_by: srv_layout
  - path: /srv/data
    owner: "{{ nuc_admin_user }}"
    group: "{{ nuc_admin_user }}"
    mode: "0750"
    purpose: 服务持久化数据与备份重点
    managed_by: srv_layout
  - path: /srv/automation
    owner: "{{ nuc_agent_runner_user }}"
    group: "{{ nuc_agent_runner_user }}"
    mode: "0750"
    purpose: 受限自动化工作区
    managed_by: agent_runner

nuc_base_packages:
  - openssh-server
  - curl
  - ca-certificates
  - gnupg
  - git
  - tmux
  - ripgrep
  - jq
  - ufw
  - unattended-upgrades
  - nvme-cli
  - smartmontools
  - lm-sensors
  - btop
  - restic

nuc_sleep_targets:
  - sleep.target
  - suspend.target
  - hibernate.target
  - hybrid-sleep.target

nuc_unattended_upgrades_auto_reboot: false
nuc_journald_system_max_use: 1G
nuc_nvme_device: /dev/nvme0
nuc_ufw_lan_ssh_port: 22
nuc_ufw_tailscale_ports:
  - 22
  - "{{ nuc_paseo_port }}"

nuc_sshd_hardening_options:
  PermitRootLogin: "no"
  PubkeyAuthentication: "yes"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  X11Forwarding: "no"
nuc_confirm_key_removal: false

nuc_docker_package_versions:
  docker-ce: ""
  docker-ce-cli: ""
  containerd.io: ""
  docker-buildx-plugin: ""
  docker-compose-plugin: ""
nuc_docker_log_max_size: 10m
nuc_docker_log_max_file: "3"
# 发布容器端口时的默认宿主绑定地址。UFW 挡不住 Docker 的 DNAT，
# 这是第一道默认防线（不是强制边界，显式 host IP 仍可覆盖）。
nuc_docker_default_host_binding: "127.0.0.1"

nuc_codex_installer_url: https://chatgpt.com/codex/install.sh
nuc_codex_admin_version: latest
nuc_codex_system_version: latest

nuc_tailscale_channel: stable
nuc_tailscale_package_version: ""

nuc_nodejs_major: 22
nuc_nodejs_package_version: ""
nuc_paseo_cli_version: latest
nuc_paseo_npm_prefix_relative: .local/npm

# nuc_paseo_password_configured 刻意不在此处赋值。
#
# group_vars/all/ 按字母序加载且后者覆盖前者，main.yml 排在 local.yml 之后，
# 因此只要这里给了值，local.yml 里改成 true 就会被静默覆盖，现象是
# 「我明明改了 local.yml 却还是卡在密码门禁」。安全兜底放在
# roles/paseo/defaults/main.yml（优先级最低，值为 false），人工执行
# `paseo daemon set-password` 之后在不提交的 local.yml 里改成 true。
# 同一处理方式见 nuc_ops_agent_enabled。

nuc_cloudflared_package_version: ""
nuc_cloudflared_enable_service: true

nuc_agent_runner_task_prompt: 执行每日自动化任务，并把结果写入 reports/
# prompt 渲染到 /etc 下的只读文件，由 StandardInput 送进 codex exec。
# 不放 agent-runner 的 home：那里在 ReadWritePaths 之内，agent 能改写自己的指令。
nuc_agent_runner_config_dir: /etc/agent-runner
nuc_agent_runner_prompt_path: /etc/agent-runner/task-prompt.txt
nuc_agent_runner_schedule: "*-*-* 07:30:00 Australia/Melbourne"
nuc_agent_runner_randomized_delay: 10m
nuc_agent_runner_timer_enabled: false

# nuc_ops_agent_enabled 是本机部署选择，由不提交的 local.yml 提供，此处不定义。
# 注意：group_vars/all/ 按字母序加载且后者覆盖前者，main.yml 在 local.yml 之后，
# 一旦在这里给出定义就会盖掉 local.yml 的值。role defaults 里的 false 是安全兜底。
nuc_ops_agent_user: solar
nuc_ops_agent_home: /home/solar
nuc_ops_agent_workspace: /var/lib/openclaw-ops-agent/workspace
nuc_ops_agent_gateway_port: 18789
nuc_openclaw_version: 2026.8.1-beta.2

nuc_restic_package_version: ""
# nuc_restic_repository 是环境相关值，由 local.yml 提供（见本文件顶部说明）。
nuc_restic_backup_paths:
  - /srv
  - /etc/ssh
  - /etc/systemd/system
  - /var/lib/openclaw-ops-agent/workspace/MEMORY.md
  - /var/lib/openclaw-ops-agent/workspace/memory
  - /var/lib/openclaw-ops-agent/workspace/reports
nuc_restic_excludes:
  - "**/node_modules"
  - /srv/worktrees
  - "**/.cache"
  - "**/.codex/auth.json"
nuc_restic_keep:
  daily: 7
  weekly: 4
  monthly: 6
  yearly: 1
nuc_restic_schedule: "*-*-* 02:30:00 Australia/Melbourne"
nuc_restic_randomized_delay: 30m
nuc_restic_read_data_subset: 5%
nuc_restic_env_file: /etc/restic/agent-nuc.env
nuc_restic_wrapper_path: /usr/local/sbin/agent-restic-backup
# 可查询的失败状态：单行 `ok <ISO 时间>` 或 `failed <ISO 时间>`。
# 这不是告警——没有检查者、检查频率和通知出口。
nuc_restic_status_file: /var/lib/agent-restic/last-run.status
nuc_restic_status_helper: /usr/local/sbin/agent-restic-status
nuc_restic_initialize_repository: false
# 首次 init 后用 `restic cat config` 记下仓库 ID 填在这里（建议写进 local.yml）。
# 留空表示不校验仓库身份。
# nuc_restic_expected_repository_id 刻意不在此处赋值。
#
# 它是首次 init 后由 `restic cat config` 实测得到的本机值。main.yml 排在
# local.yml 之后加载，这里给了值就会静默覆盖 local.yml，导致仓库身份校验
# 永远处于"未设置、跳过校验"状态——而这道校验的作用恰恰是防止静默换库。
# 安全兜底在 roles/restic/defaults/main.yml（空字符串，跳过校验）。
nuc_restic_enable_timer: true
