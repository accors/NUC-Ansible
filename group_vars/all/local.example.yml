---
# group_vars/all/local.yml 的模板。复制为 local.yml 后填入真实值：
#
#   cp group_vars/all/local.example.yml group_vars/all/local.yml
#
# local.yml 不提交进 Git（见 .gitignore）。此处所有值都是占位符，不是可用配置。
# 每一项的用途、来源命令与约束见 group_vars/all/main.yml 顶部的注释。

# Debian 安装器创建的管理员账号，需与 inventory.yml 的 ansible_user 一致。
# 目标机的系统主机名。RFC 1123 标签：字母、数字、连字符，不以连字符开头或结尾，
# 长度不超过 63。会出现在 SSH 提示符、journald 日志与 Tailscale 设备名里。
nuc_hostname: CHANGE_ME

# 是否启用 ops_agent（OpenClaw）。默认 false —— 它是唯一会把系统 journal 内容
# 作为 tool result 送进模型上下文的组件，也就是唯一一条把系统日志送出本机的路径。
# 确认接受这一点再改为 true。
nuc_ops_agent_enabled: false

nuc_admin_user: CHANGE_ME

# 管理员登录公钥，至少一把，整行照抄 .pub 文件内容。
# ssh_harden 以 exclusive: true 写入。若未列出的现有公钥将被移除，role 会先停止，
# 只有显式传入 -e nuc_confirm_key_removal=true 才会继续。
nuc_admin_authorized_keys:
  - "ssh-ed25519 CHANGE_ME_REPLACE_WITH_REAL_PUBLIC_KEY CHANGE_ME"

# 家庭 LAN 网段，在 NUC 上用 `ip route` 实测。填错会在启用 UFW 时阻断 SSH。
# 占位值取自 RFC 5737 文档网段，直接使用会把自己挡在门外。
nuc_lan_cidr: 192.0.2.0/24

# enp86s0 的静态地址。掩码不单独设，由 nuc_lan_cidr 推导，两者必须一致。
# 必须落在 nuc_lan_cidr 内、不是网络地址或广播地址、且不等于网关，
# network role 会在写入 profile 前逐条断言。
# 还要确认它在路由器 DHCP 池之外，否则早晚与新接入的设备撞地址。
nuc_static_ipv4: 192.0.2.10

# 默认网关，实测 `ip route` 中 default via 的地址。
nuc_lan_gateway: 192.0.2.1

# DNS 解析器。切换到静态后 DHCP 不再下发，必须显式给出；
# 可沿用切换前 /etc/resolv.conf 中路由器下发的上游地址。
nuc_lan_dns:
  - 192.0.2.53
  - 192.0.2.54

# `sudo tailscale up` 授权后用 `tailscale ip -4` 实测，必须属于 100.64.0.0/10。
nuc_tailscale_ipv4: CHANGE_ME

# Cloudflare Published application 的 Hostname，必须与 Dashboard 完全一致。
nuc_access_hostname: agent.example.invalid

# Restic 备份仓库地址：本地路径或远端 URL。URL 中不得嵌入账号、密码或 token，
# 凭据走 vault.yml 的 vault_nuc_restic_password。
nuc_restic_repository: CHANGE_ME
