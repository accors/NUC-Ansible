---
# ssh_harden 只重述共享契约中本 role 使用的变量。
nuc_admin_user: CHANGE_ME
nuc_admin_authorized_keys: []
nuc_confirm_key_removal: false

# authorized_keys 允许在 key 类型前放 options（from=、command=、no-pty 等）。
# 本 role 的归一化取 split()[0:2]，遇到带 options 的条目会取错字段。与其做半吊子
# 解析，不如用类型白名单明确拒绝——校验放在写入与关闭密码认证之前，拒绝是安全的。
nuc_ssh_supported_key_types:
  - ssh-ed25519
  - ssh-rsa
  - ecdsa-sha2-nistp256
  - ecdsa-sha2-nistp384
  - ecdsa-sha2-nistp521
  - sk-ssh-ed25519@openssh.com
  - sk-ecdsa-sha2-nistp256@openssh.com

nuc_sshd_hardening_options:
  PermitRootLogin: "no"
  PubkeyAuthentication: "yes"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  X11Forwarding: "no"
