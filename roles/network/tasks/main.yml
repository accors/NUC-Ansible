---
# enp86s0 静态地址。目标机由 NetworkManager 管理（/etc/resolv.conf 顶部为
# "Generated by NetworkManager"，地址带 noprefixroute 标记），因此走 nmcli，
# 不写 /etc/network/interfaces.d/。
#
# 本 role 只修改 profile，不激活：nmcli con modify 不会影响已激活的连接，
# 地址切换发生在重启（或人工 nmcli con up）时。这样 Ansible 连接不会在
# play 中途断掉，切换是 docs/INTERACTIVE-CHECKLIST.md 里的一道人工门禁。

- name: 静态地址相关变量必须已定义
  ansible.builtin.assert:
    that:
      - nuc_static_ipv4 is defined
      - nuc_lan_gateway is defined
      - nuc_lan_dns is defined
      - nuc_lan_dns | length > 0
      - nuc_lan_cidr is defined
    fail_msg: >-
      nuc_static_ipv4、nuc_lan_gateway、nuc_lan_dns 由 group_vars/all/local.yml 提供，
      模板见 local.yml.example。
    quiet: true

# 掩码长度只从 nuc_lan_cidr 推导，不单独设变量：UFW 规则用的是同一个 CIDR，
# 分开写迟早会出现 /22 与 /24 不一致，而那种错误要等到访问高位地址时才暴露。
- name: 由 nuc_lan_cidr 推导网段边界
  ansible.builtin.set_fact:
    _net_prefix: "{{ nuc_lan_cidr.split('/')[1] | int }}"
    _net_size: "{{ 2 ** (32 - (nuc_lan_cidr.split('/')[1] | int)) | int }}"
    _net_int: "{{ _o[0] | int * 16777216 + _o[1] | int * 65536 + _o[2] | int * 256 + _o[3] | int }}"
    _ip_int: "{{ _i[0] | int * 16777216 + _i[1] | int * 65536 + _i[2] | int * 256 + _i[3] | int }}"
    _gw_int: "{{ _g[0] | int * 16777216 + _g[1] | int * 65536 + _g[2] | int * 256 + _g[3] | int }}"
  vars:
    _o: "{{ nuc_lan_cidr.split('/')[0].split('.') | map('int') | list }}"
    _i: "{{ nuc_static_ipv4.split('.') | map('int') | list }}"
    _g: "{{ nuc_lan_gateway.split('.') | map('int') | list }}"

# 写出一个网关不可达或地址越界的 profile，等于把机器变成砖：重启后以太网起不来，
# 只剩 WiFi 兜底，没有 WiFi 就得接键盘显示器。所以在落盘前拦住。
- name: 静态地址与网关必须落在 nuc_lan_cidr 内且互不相同
  ansible.builtin.assert:
    that:
      - (_ip_int | int) > (_net_int | int)
      - (_ip_int | int) < (_net_int | int) + (_net_size | int) - 1
      - (_gw_int | int) > (_net_int | int)
      - (_gw_int | int) < (_net_int | int) + (_net_size | int) - 1
      - (_ip_int | int) != (_gw_int | int)
    fail_msg: >-
      nuc_static_ipv4={{ nuc_static_ipv4 }} 与 nuc_lan_gateway={{ nuc_lan_gateway }}
      必须都落在 {{ nuc_lan_cidr }} 内（不含网络地址与广播地址）且互不相同。
    quiet: true

- name: 探测接口上当前激活的 NetworkManager profile
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - GENERAL.CONNECTION
      - device
      - show
      - "{{ nuc_lan_interface }}"
  register: _nm_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: 接口必须存在且由 NetworkManager 管理
  ansible.builtin.assert:
    that:
      - _nm_active.rc == 0
      - (_nm_active.stdout | trim) | length > 0
      - (_nm_active.stdout | trim) != '--'
    fail_msg: >-
      {{ nuc_lan_interface }} 不存在，或没有被 NetworkManager 接管。
      本 role 只支持 NetworkManager；请先确认 `nmcli device status`。
    quiet: true

# 只改实测正在生效的那个 profile。名字对不上就停，绝不新建 —— 新建会留下
# 两个绑定同一接口的 autoconnect profile。
- name: 激活的 profile 名必须与 nuc_lan_connection_name 一致
  ansible.builtin.assert:
    that: (_nm_active.stdout | trim) == nuc_lan_connection_name
    fail_msg: >-
      {{ nuc_lan_interface }} 上实际激活的 profile 是
      "{{ _nm_active.stdout | trim }}"，与 nuc_lan_connection_name
      ("{{ nuc_lan_connection_name }}") 不一致。请核对后修改该变量，
      不要让 role 新建 profile。
    quiet: true

# conn_reload 保持默认 false：只执行 nmcli con modify，不激活。
# 已激活的连接保持旧地址，Ansible 连接不会断。
- name: 将 profile 改为静态地址
  community.general.nmcli:
    conn_name: "{{ nuc_lan_connection_name }}"
    type: ethernet
    ifname: "{{ nuc_lan_interface }}"
    state: present
    autoconnect: true
    method4: manual
    ip4:
      - "{{ nuc_static_ipv4 }}/{{ _net_prefix }}"
    gw4: "{{ nuc_lan_gateway }}"
    dns4: "{{ nuc_lan_dns }}"
    route_metric4: "{{ nuc_lan_route_metric | int }}"

- name: 回读 profile 落盘后的实际值
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.dns,ipv4.route-metric
      - connection
      - show
      - "{{ nuc_lan_connection_name }}"
  register: _nm_readback
  changed_when: false
  check_mode: false

- name: 落盘的 profile 必须与期望一致
  ansible.builtin.assert:
    that:
      - _nm_readback.stdout_lines[0] == 'manual'
      - _nm_readback.stdout_lines[1] == nuc_static_ipv4 ~ '/' ~ _net_prefix
      - _nm_readback.stdout_lines[2] == nuc_lan_gateway
    fail_msg: "回读结果与期望不符：{{ _nm_readback.stdout_lines }}"
    quiet: true
  when: not ansible_check_mode

- name: 读取接口当前运行态地址
  ansible.builtin.command:
    argv: [nmcli, --get-values, IP4.ADDRESS, device, show, "{{ nuc_lan_interface }}"]
  register: _nm_running
  changed_when: false
  check_mode: false

# 不用 fail：network 排在最前，失败会挡住后面所有 role，而此时旧地址仍然可用，
# base 等阶段本来就该照跑。切换动作是交互清单里的一道人工门禁。
- name: 提示静态地址尚未生效
  ansible.builtin.debug:
    msg:
      - "profile 已写入静态地址 {{ nuc_static_ipv4 }}/{{ _net_prefix }}，但尚未生效。"
      - "接口当前运行态：{{ _nm_running.stdout_lines | join(', ') }}"
      - "按 docs/INTERACTIVE-CHECKLIST.md 的 A2 重启目标机完成切换，"
      - "然后把 inventory.yml 的 ansible_host 改成 {{ nuc_static_ipv4 }}。"
  when:
    - not ansible_check_mode
    - (nuc_static_ipv4 ~ '/' ~ _net_prefix) not in (_nm_running.stdout_lines | default([]))
