---
# Restic role 只重述共享契约中属于本 role 的默认值。
nuc_restic_package_version: ""
nuc_restic_repository: CHANGE_ME

# S3 类后端的区域。Cloudflare R2 要求固定为 auto；换成 AWS S3 或 MinIO 时
# 填各自的真实区域。仅在 vault 里配了 S3 凭据时才写进环境文件。
nuc_restic_s3_region: auto
nuc_restic_backup_paths:
  - /srv
  - /etc/ssh
  - /etc/systemd/system
  - /var/lib/openclaw-ops-agent/workspace/MEMORY.md
  - /var/lib/openclaw-ops-agent/workspace/memory
  - /var/lib/openclaw-ops-agent/workspace/reports
nuc_restic_excludes:
  - "**/node_modules"
  - /srv/worktrees
  - "**/.cache"
  - "**/.codex/auth.json"
nuc_restic_keep:
  daily: 7
  weekly: 4
  monthly: 6
  yearly: 1
nuc_restic_schedule: "*-*-* 02:30:00 Australia/Melbourne"
nuc_restic_randomized_delay: 30m
nuc_restic_read_data_subset: 5%
nuc_restic_env_file: /etc/restic/agent-nuc.env
nuc_restic_wrapper_path: /usr/local/sbin/agent-restic-backup
# 可查询的失败状态（不是告警：没有检查者、频率与通知出口）。
# 内容为单行 `ok <ISO 时间>` 或 `failed <ISO 时间>`。
nuc_restic_status_file: /var/lib/agent-restic/last-run.status
nuc_restic_status_helper: /usr/local/sbin/agent-restic-status
nuc_restic_initialize_repository: false
# 首次 init 后用 `restic cat config` 记下仓库 ID 填在这里（建议写进 local.yml）。
# 留空表示不校验仓库身份。
nuc_restic_expected_repository_id: ""
nuc_restic_enable_timer: true
