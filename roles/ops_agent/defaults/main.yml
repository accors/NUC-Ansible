---
# ops_agent 只重述共享契约中本 role 使用的变量。
# 默认不启用：ops_agent 会把 journal 内容作为 tool result 送进模型上下文，
# 是本项目唯一一个把系统日志送出本机的组件。site.yml 以此变量为门禁，
# 未显式置 true 时整个 role 不执行，不安装、不建账号、不启服务。
nuc_ops_agent_enabled: false

nuc_ops_agent_user: solar
nuc_ops_agent_home: /home/solar
nuc_ops_agent_workspace: /var/lib/openclaw-ops-agent/workspace

# ops 可观察的 unit 白名单。journal 与 unit 状态的读取一律限定在这张表内：
# 这是确定性控制，可穷举、可审计。正则脱敏之类的输出过滤只能当兜底，
# 因为日志里 secret 的形态穷举不完。新增被监控服务时必须显式加进来。
nuc_ops_agent_observable_units:
  - ssh.service
  - ufw.service
  - docker.service
  - containerd.service
  - tailscaled.service
  - cloudflared.service
  - smartd.service
  - unattended-upgrades.service
  - systemd-journald.service
  - agent-codex-daily.service
  - agent-codex-daily.timer
  - agent-restic-backup.service
  - agent-restic-backup.timer
  - agent-restic-backup-failed.service
  - openclaw-ops-agent.service

# `systemctl show` 允许读取的属性。show 输出是 key=value 元数据、不含日志，
# 但仍限定属性：Environment= 一类属性可能带出 unit 里内联的敏感值。
nuc_ops_agent_observable_properties:
  - ActiveState
  - SubState
  - LoadState
  - UnitFileState
  - Result
  - ExecMainStatus
  - ExecMainStartTimestamp
  - ExecMainExitTimestamp
  - ActiveEnterTimestamp
  - InactiveEnterTimestamp
  - NRestarts
  - LastTriggerUSec
  - NextElapseUSecRealtime
# ops agent 使用的模型。同时写进 agents.defaults.model.primary 与
# agents.defaults.models 的允许列表，因此这一个变量就限定了 ops 能用的全部模型
# —— 覆盖运行时 --model 会被 modelPolicy 拒绝。
#
# 取决于账号的订阅套餐：`openclaw models list` 里的 Auth: yes 只表示该 provider
# 有凭据，不等于这个模型在你的套餐上可路由。不可路由时报
# "Unable to materialize <model> for its prepared subscription route"，
# 而错误信息不会提示是套餐问题。换账号或换套餐时可能需要改这里。
nuc_ops_agent_model: openai/gpt-5.6-sol

nuc_ops_agent_gateway_port: 18789
nuc_openclaw_version: 2026.8.1-beta.3
nuc_nodejs_major: 22
nuc_nvme_device: /dev/nvme0
