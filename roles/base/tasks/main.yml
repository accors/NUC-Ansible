---
# base —— PDF 6.1、6.3、6.4、7.2、7.3、12.4、13.2

- name: 校验基础防护的固定边界
  ansible.builtin.assert:
    that:
      - not (nuc_unattended_upgrades_auto_reboot | bool)
      - nuc_ufw_tailscale_ports | length == 2
      - nuc_ufw_tailscale_ports[0] | int == 22
      - nuc_ufw_tailscale_ports[1] | int == nuc_paseo_port | int
    fail_msg: >-
      base 的第一阶段边界无效：自动重启必须为 false，且
      nuc_ufw_tailscale_ports 必须严格为 [22, nuc_paseo_port]。

# --- 主机名 ---
# 校验放在设置之前：hostname 写坏会让 sudo 每次报 unable to resolve host，
# 且需要控制台才能修回来。
- name: 校验主机名格式
  ansible.builtin.assert:
    that:
      - (nuc_hostname | default('') | string | trim | length) > 0
      - (nuc_hostname | string | trim | upper) != 'CHANGE_ME'
      - (nuc_hostname | string | trim) is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$')
    fail_msg: >-
      nuc_hostname 未设置或不是合法的 RFC 1123 主机名标签。请在不提交的
      group_vars/all/local.yml 中填入真实主机名：只能含字母、数字和连字符，
      不得以连字符开头或结尾，长度不超过 63。

- name: 设置主机名
  ansible.builtin.hostname:
    name: "{{ nuc_hostname | trim }}"

# ansible.builtin.hostname 只写 /etc/hostname 与 hostnamectl，不碰 /etc/hosts。
# Debian 约定用 127.0.1.1 解析本机名；缺这一行时 sudo 会反复报
# 「unable to resolve host」。
- name: 维护 /etc/hosts 中的 127.0.1.1 本机名解析
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ nuc_hostname | trim }}"
    owner: root
    group: root
    mode: "0644"

- name: 更新 APT 缓存（PDF 6.1）
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: 执行 APT full-upgrade（PDF 6.1）
  ansible.builtin.apt:
    upgrade: full

- name: 安装契约规定的基础软件包（PDF 6.1）
  ansible.builtin.apt:
    name: "{{ nuc_base_packages }}"
    state: present

# --- 无头运行：禁止一切自动睡眠（PDF 6.3） ---
- name: 屏蔽四个自动睡眠 target（PDF 6.3）
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: "{{ nuc_sleep_targets }}"

# --- 自动安全更新（PDF 6.4） ---
- name: 写入 unattended-upgrades 周期配置
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  notify: "base | restart unattended-upgrades"

- name: 写入 unattended-upgrades 自动重启关闭配置
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-agent-nuc-no-auto-reboot
    owner: root
    group: root
    mode: "0644"
    content: |
      // 第一阶段禁止自动重启，避免打断正在写文件的 Agent。
      Unattended-Upgrade::Automatic-Reboot "false";
  notify: "base | restart unattended-upgrades"

- name: 启用并启动 unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

# --- journald 磁盘上限（任务补充、PDF 12.4） ---
- name: 确保 journald drop-in 目录存在
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 限制 journald 磁盘占用
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-agent-nuc-size.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ nuc_journald_system_max_use }}
  notify: "base | restart systemd-journald"

# --- UFW 最小开放（PDF 7.2、7.3） ---
- name: 设置 UFW 默认拒绝入站
  community.general.ufw:
    direction: incoming
    policy: deny

- name: 设置 UFW 默认允许出站
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: 允许 LAN 网段访问 SSH
  community.general.ufw:
    rule: allow
    direction: in
    src: "{{ nuc_lan_cidr }}"
    port: "{{ nuc_ufw_lan_ssh_port }}"
    proto: tcp

# tailscale0 尚未出现时也先写入规则，不依赖接口已创建。
- name: 允许 tailscale0 访问 SSH 与 Paseo
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    port: "{{ item }}"
    proto: tcp
  loop: "{{ nuc_ufw_tailscale_ports }}"

# Paseo daemon 监听 0.0.0.0（见 paseo role 的 config.json）。default deny incoming
# 已经挡住 LAN，这条 deny 是显式声明：让 `ufw status` 直接读得出「LAN 不得访问
# Paseo 端口」，也避免日后有人在前面插入宽泛的 allow 时静默放行。
- name: 显式拒绝 LAN 网段访问 Paseo 端口
  community.general.ufw:
    rule: deny
    direction: in
    src: "{{ nuc_lan_cidr }}"
    port: "{{ nuc_paseo_port }}"
    proto: tcp

- name: 启用 UFW
  community.general.ufw:
    state: enabled

# --- 传感器与磁盘监控（PDF 12.4、13.2） ---
- name: 确保模块加载配置目录存在
  ansible.builtin.file:
    path: /etc/modules-load.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 检查 sensors-detect 幂等状态标记
  ansible.builtin.stat:
    path: /etc/modules-load.d/agent-nuc-sensors-detect.state
  register: _base_sensors_detect_state

- name: 自动探测传感器模块（仅首次执行）
  ansible.builtin.command:
    cmd: sensors-detect --auto
    creates: /etc/modules-load.d/agent-nuc-sensors-detect.state
  register: _base_sensors_detect
  when: not _base_sensors_detect_state.stat.exists
  changed_when:
    - not (_base_sensors_detect.skipped | default(false))
    - (_base_sensors_detect.rc | default(1)) == 0

- name: 记录 sensors-detect 已成功执行
  ansible.builtin.copy:
    dest: /etc/modules-load.d/agent-nuc-sensors-detect.state
    owner: root
    group: root
    mode: "0644"
    content: "sensors-detect --auto 已由 Ansible 执行。\n"
  when:
    - not _base_sensors_detect_state.stat.exists
    - not (_base_sensors_detect.skipped | default(false))
    - (_base_sensors_detect.rc | default(1)) == 0

- name: 为 NVMe 配置 smartd 监控
  ansible.builtin.copy:
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ nuc_nvme_device }} -d nvme -a
  notify: "base | restart smartd"

- name: 启用并启动 smartd（PDF 12.4）
  ansible.builtin.systemd_service:
    name: smartd
    enabled: true
    state: started
