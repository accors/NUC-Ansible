---
# base 只重述共享契约中本 role 使用的变量。
nuc_base_packages:
  - openssh-server
  - curl
  - ca-certificates
  - gnupg
  - git
  - tmux
  - ripgrep
  - jq
  - ufw
  - unattended-upgrades
  - nvme-cli
  - smartmontools
  - lm-sensors
  - btop
  - restic

nuc_sleep_targets:
  - sleep.target
  - suspend.target
  - hibernate.target
  - hybrid-sleep.target

nuc_unattended_upgrades_auto_reboot: false
nuc_journald_system_max_use: 1G
nuc_nvme_device: /dev/nvme0
# nuc_hostname 与 nuc_lan_cidr 都是环境相关值，由不提交的
# group_vars/all/local.yml 提供，此处不设默认值。
nuc_ufw_lan_ssh_port: 22
nuc_paseo_port: 6767
nuc_ufw_tailscale_ports:
  - 22
  - "{{ nuc_paseo_port }}"

# Debian 官方 APT 源。用完整 DVD ISO 离线安装时，安装器会在装完后把 cdrom 源
# 注释掉，而跳过网络镜像那一步就意味着一个可用源都不剩——apt 里连 curl 都没有
# 候选版本。preseed 安装（mirror/http/hostname）不会出现这个问题，但本 role
# 仍然显式写入，好让重装与灾难恢复不依赖安装方式。
# 与 tailscale/defaults 中的声明保持一致（CONVENTIONS 2.1）。
nuc_debian_codename: trixie

nuc_debian_mirror_uri: http://deb.debian.org/debian
nuc_debian_security_uri: http://security.debian.org/debian-security

# 组件与安装介质保持一致（DVD 提供的是 contrib main non-free-firmware）。
# non-free-firmware 必须保留：Intel 无线网卡等硬件的固件包在这个组件里，
# 去掉之后固件不再收到安全更新。
nuc_debian_components:
  - main
  - contrib
  - non-free-firmware
