---
# tailscale —— PDF 8.4、8.5、10.1、10.2：安装守护进程，授权与 tailscale up 保持人工完成。

- name: 校验 Tailscale 官方仓库参数
  ansible.builtin.assert:
    that:
      - (nuc_tailscale_channel | string) is match('^[a-z0-9][a-z0-9.-]*$')
      - (nuc_debian_codename | string) is match('^[a-z0-9][a-z0-9.-]*$')
      - (nuc_architecture | string) is match('^[a-z0-9][a-z0-9_+.-]*$')
      - >-
        (nuc_tailscale_package_version | default('', true) | string | trim) == '' or
        (nuc_tailscale_package_version | string | trim) is match('^[^\\s=]+$')
    fail_msg: >-
      Tailscale APT 参数无效：channel、Debian codename、architecture 必须是安全的单段值，
      package version 为空或必须是单个精确版本字符串。

- name: 组装 Tailscale APT 软件包规格
  ansible.builtin.set_fact:
    _tailscale_package_spec: >-
      {{
        'tailscale'
        if (nuc_tailscale_package_version | default('', true) | string | trim) == ''
        else 'tailscale=' ~ (nuc_tailscale_package_version | string | trim)
      }}

- name: 确保下载仓库所需的 CA 证书
  ansible.builtin.apt:
    name: ca-certificates
    state: present

- name: 确保 APT keyring 目录存在
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 下载 Tailscale 官方 Debian keyring
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/{{ nuc_tailscale_channel }}/debian/{{ nuc_debian_codename }}.noarmor.gpg"
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
    force: false
    validate_certs: true

- name: 配置 Tailscale 官方 Debian APT 仓库
  ansible.builtin.template:
    src: tailscale.list.j2
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"

- name: 更新 Tailscale APT 仓库索引
  ansible.builtin.apt:
    update_cache: true

- name: 记录安装前 Tailscale 客户端状态
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: _tailscale_binary_before_install

- name: 按契约版本安装 Tailscale 客户端
  ansible.builtin.apt:
    name: "{{ _tailscale_package_spec }}"
    state: present
    allow_downgrade: true

- name: 启用并启动 tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  when: not ansible_check_mode or _tailscale_binary_before_install.stat.exists

# --check 在全新主机上不会执行 apt 安装；只有实际已有客户端时才做本轮只读校验。
- name: 记录安装后 Tailscale 客户端状态
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: _tailscale_binary_after_install
  when: not ansible_check_mode or _tailscale_binary_before_install.stat.exists

- name: 在 Tailscale 客户端不可执行时明确失败
  ansible.builtin.fail:
    msg: >-
      Tailscale 软件包安装后未找到可执行的 /usr/bin/tailscale；请检查官方 APT 仓库与
      软件包安装结果后重跑 tailscale tag。
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - >-
      not _tailscale_binary_after_install.stat.exists or
      not _tailscale_binary_after_install.stat.isreg or
      not _tailscale_binary_after_install.stat.executable

- name: 只读探测 Tailscale IPv4
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - ip
      - -4
  register: _tailscale_ip_probe
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_binary_after_install.stat.exists
    - _tailscale_binary_after_install.stat.isreg
    - _tailscale_binary_after_install.stat.executable

- name: 在 Tailscale 未授权或没有 IPv4 时中止
  ansible.builtin.fail:
    msg: >-
      未取得 Tailscale IPv4。请人工执行 `sudo tailscale up` 完成浏览器授权，再参考
      PDF 8.5/10.2 与 docs/INTERACTIVE-CHECKLIST.md 中的 Tailscale 步骤，随后重跑
      tailscale tag；本 role 绝不自动执行 tailscale up。
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_ip_probe.rc != 0

- name: 提取 Tailscale IPv4 探测结果
  ansible.builtin.set_fact:
    _tailscale_ipv4_lines: >-
      {{ _tailscale_ip_probe.stdout_lines | map('trim') | reject('equalto', '') | list }}
    _tailscale_detected_ipv4: >-
      {{
        (_tailscale_ip_probe.stdout_lines | map('trim') | reject('equalto', '') | list
        | first | default(''))
      }}
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_ip_probe.rc == 0

- name: 校验 Tailscale 返回唯一且格式正确的 IPv4
  ansible.builtin.assert:
    that:
      - _tailscale_ipv4_lines | length == 1
      - (_tailscale_detected_ipv4 | trim) is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
    fail_msg: >-
      tailscale ip -4 没有返回唯一的 IPv4 地址。请人工执行 `sudo tailscale up` 完成浏览器
      授权，并按 PDF 8.5/10.2 与 docs/INTERACTIVE-CHECKLIST.md 检查后重跑 tailscale tag。
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_ip_probe.rc == 0

- name: 拆分 Tailscale IPv4 八位组
  ansible.builtin.set_fact:
    _tailscale_ipv4_octets: "{{ _tailscale_detected_ipv4.split('.') | map('int') | list }}"
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_ip_probe.rc == 0

- name: 校验 Tailscale IPv4 属于 CGNAT 网段
  ansible.builtin.assert:
    that:
      - _tailscale_ipv4_octets | length == 4
      - (_tailscale_ipv4_octets | min | int) >= 0
      - (_tailscale_ipv4_octets | max | int) <= 255
      - _tailscale_ipv4_octets[0] | int == 100
      - _tailscale_ipv4_octets[1] | int >= 64
      - _tailscale_ipv4_octets[1] | int <= 127
    fail_msg: >-
      探测到的 Tailscale IPv4 {{ _tailscale_detected_ipv4 }} 不属于 Tailscale 要求的
      CGNAT 100.64.0.0/10。请人工执行 `sudo tailscale up` 完成浏览器授权，并参考
      PDF 8.5/10.2 与 docs/INTERACTIVE-CHECKLIST.md 后重跑 tailscale tag。
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_ip_probe.rc == 0

- name: 校验 Tailscale IPv4 与清单配置一致
  ansible.builtin.assert:
    that:
      - _tailscale_detected_ipv4 == (nuc_tailscale_ipv4 | string | trim)
    fail_msg: >-
      tailscale ip -4 探测到 {{ _tailscale_detected_ipv4 }}，但清单中的
      nuc_tailscale_ipv4={{ nuc_tailscale_ipv4 }} 不一致。请人工执行 `sudo tailscale up`
      重新授权或修正清单，并参考 PDF 8.5/10.2 与 docs/INTERACTIVE-CHECKLIST.md 后重跑。
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_ip_probe.rc == 0

- name: 导出 Tailscale IPv4 运行时事实
  ansible.builtin.set_fact:
    nuc_tailscale_detected_ipv4: "{{ _tailscale_detected_ipv4 }}"
  when:
    - not ansible_check_mode or _tailscale_binary_before_install.stat.exists
    - _tailscale_ip_probe.rc == 0
