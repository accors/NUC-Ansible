---
# docker —— PDF 9.2 / 9.3：官方仓库、Docker Engine 与 json-file 日志轮转。

- name: 安装 Docker APT 仓库所需的 CA 证书
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true

- name: 确保 APT keyring 目录存在
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 下载 Docker 官方 APT key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false
  register: _docker_apt_key

- name: 配置 Docker 官方 Debian deb822 仓库
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: _docker_apt_repo

# 无条件 update_cache 每次都报 changed，第二遍 --check --diff 永远不干净，
# 违反契约的幂等要求。但也不能简单加 cache_valid_time —— 它只比对
# /var/lib/apt/lists 的目录 mtime，不看里面有没有 Docker 的索引（同 base 的坑）。
# 因此显式探测 Docker 自己的索引文件，缺失时才刷新。
- name: 探测 Docker 仓库索引是否已下载
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: "download.docker.com*_Packages*"
    file_type: file
  register: _docker_apt_lists
  changed_when: false

- name: 仓库变更或索引缺失时刷新 APT 索引  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when: >-
    _docker_apt_key.changed or _docker_apt_repo.changed
    or _docker_apt_lists.matched == 0

- name: 按契约版本安装 Docker 软件包
  ansible.builtin.apt:
    name: >-
      {{
        item.key
        if (item.value is none or (item.value | string | trim) == '')
        else item.key ~ '=' ~ (item.value | string)
      }}
    state: present
  loop: "{{ nuc_docker_package_versions | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: 确保 Docker 配置目录存在
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 探测现有 daemon.json
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: _docker_daemon_stat

- name: 没有现有 daemon.json 时从空对象开始
  ansible.builtin.set_fact:
    _docker_existing_daemon: {}
  when: not _docker_daemon_stat.stat.exists

- name: 解析现有 daemon.json
  when: _docker_daemon_stat.stat.exists
  block:
    - name: 读取现有 daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: _docker_daemon_slurp

    - name: 将现有 daemon.json 解析为 JSON 对象
      ansible.builtin.set_fact:
        _docker_existing_daemon: "{{ _docker_daemon_slurp.content | b64decode | from_json }}"
  rescue:
    - name: 现有 daemon.json 无效时明确中止
      ansible.builtin.fail:
        msg: >-
          /etc/docker/daemon.json 不是合法 JSON，已停止而未覆盖原文件。
          请先人工修复该文件，再重跑 docker role。
- name: 校验 daemon.json 为对象且 log-opts 可递归合并
  ansible.builtin.assert:
    that:
      - _docker_existing_daemon is mapping
      - _docker_existing_daemon.get('log-opts', {}) is mapping
    fail_msg: >-
      /etc/docker/daemon.json 必须是 JSON 对象，且 log-opts（若存在）必须是对象；
      为避免丢失现有设置，未写入合并结果。

# 发布端口的流量在到达 UFW 的 INPUT 规则之前就被 DNAT 转发，因此 UFW 挡不住
# `docker run -p`。这里把默认宿主绑定地址收到 loopback：
#   ip                                                → 默认 bridge 网络
#   default-network-opts.bridge.host_binding_ipv4     → Compose 建的用户定义 bridge
# 两个键都只是**默认值**：compose 里显式写 0.0.0.0:8080:80 仍会覆盖它们。
# 要做成强制边界得写 DOCKER-USER 链规则，那是部署第一个 stack 时的事。
- name: 递归合并 Docker 日志轮转与默认端口绑定并保留已有键
  ansible.builtin.set_fact:
    _docker_merged_daemon: >-
      {{
        _docker_existing_daemon
        | combine(
            {
              'log-driver': 'json-file',
              'log-opts': {
                'max-size': nuc_docker_log_max_size | string,
                'max-file': nuc_docker_log_max_file | string
              },
              'ip': nuc_docker_default_host_binding,
              'default-network-opts': {
                'bridge': {
                  'com.docker.network.bridge.host_binding_ipv4':
                    nuc_docker_default_host_binding
                }
              }
            },
            recursive=true
          )
      }}

- name: 写入递归合并后的 daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/python3 -m json.tool %s
  notify: docker | restart docker

- name: 启用并启动 Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
